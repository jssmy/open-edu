name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: openedu, POSTGRES_PASSWORD: openedu, POSTGRES_DB: openedu_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openedu" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { DB_HOST: 127.0.0.1, DB_USERNAME: openedu, DB_PASSWORD: openedu }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_pgsql }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: npm run lint && npm run typecheck
      - run: vendor/bin/pest
      - run: npm test
